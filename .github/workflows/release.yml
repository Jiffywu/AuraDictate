name: Release macOS DMG & ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package DMG & ZIP
        run: |
          chmod +x build.sh scripts/package-release.sh
          SIGN_IDENTITY="-" ./scripts/package-release.sh

      - name: Upload GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AuraDictate.dmg
            dist/AuraDictate-macos-arm64.zip
          generate_release_notes: true
