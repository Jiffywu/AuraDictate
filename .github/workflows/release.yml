# Builds only. Releases are signed and notarized locally with scripts/package-release.sh,
# because a build here has no Developer ID and would lose users' macOS permissions.
name: Build macOS DMG & ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package DMG & ZIP
        run: |
          chmod +x build.sh scripts/package-release.sh
          SIGN_IDENTITY="-" ./scripts/package-release.sh
